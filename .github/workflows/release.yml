name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动构建的版本号（仅用于产物命名，不会创建 Release）"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  # 先跑测试，挂了就不必浪费构建时间
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  # 交叉编译矩阵：每个平台一个 job，产物先作为 artifact 汇总
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ----
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: linux, goarch: arm, goarm: "7" }
          # ---- macOS ----
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          # ---- Windows ----
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          VERSION="${VERSION:-v0.0.0-dev}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          SUFFIX=""
          if [ -n "${GOARM:-}" ]; then SUFFIX="v${GOARM}"; fi
          OUT="vscpush"
          if [ "$GOOS" = "windows" ]; then OUT="vscpush.exe"; fi

          go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${VERSION} -X main.buildCommit=${COMMIT} -X main.buildDate=${DATE}" \
            -o "dist/${OUT}" .

          # 打包：windows 用 zip，其余用 tar.gz
          NAME="vscpush_${VERSION#v}_${GOOS}_${GOARCH}${SUFFIX}"
          mkdir -p "dist/${NAME}"
          cp "dist/${OUT}" "dist/${NAME}/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          cp LICENSE* "dist/${NAME}/" 2>/dev/null || true

          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "${NAME}.zip" "${NAME}"
            rm -rf "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            rm -rf "${NAME}"
          fi
          rm -f "${OUT}"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscpush-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # 汇总校验和 + 创建 Release 并上传全部二进制
  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: vscpush ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          body: |
            ## 下载

            | 平台 | 架构 | 文件 |
            |---|---|---|
            | Linux | x86_64 | `vscpush_*_linux_amd64.tar.gz` |
            | Linux | aarch64 / arm64 | `vscpush_*_linux_arm64.tar.gz` |
            | Linux | armv7 | `vscpush_*_linux_armv7.tar.gz` |
            | Linux | armv6 | `vscpush_*_linux_armv6.tar.gz` |
            | Linux | i386 | `vscpush_*_linux_386.tar.gz` |
            | macOS | Intel | `vscpush_*_darwin_amd64.tar.gz` |
            | macOS | Apple Silicon | `vscpush_*_darwin_arm64.tar.gz` |
            | Windows | x64 | `vscpush_*_windows_amd64.zip` |
            | Windows | arm64 | `vscpush_*_windows_arm64.zip` |
            | Windows | x86 | `vscpush_*_windows_386.zip` |

            `vscpush` 为静态编译（`CGO_ENABLED=0`），**Linux 各发行版通用**，不依赖 glibc 版本，
            可直接用于 Alpine、Debian/Ubuntu、RHEL/CentOS、Arch、openSUSE 等。

            ```bash
            tar -xzf vscpush_*_linux_amd64.tar.gz
            sudo install -m 0755 vscpush /usr/local/bin/
            vscpush -version
            ```

            校验：`sha256sum -c checksums.txt`
